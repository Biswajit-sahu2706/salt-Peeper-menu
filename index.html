<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Salt & Pepper Restaurant — Menu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --maroon:#7a0d10;
  --maroon-dark:#4d0709;
  --gold:#d4af37;
  --gold-light:#f3e3ab;
  --cream:#fff8ee;
  --ink:#2a1210;
  --muted:#8a6d5a;
  --card:#ffffff;

  color-scheme: light;

  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

*{
  box-sizing:border-box;
}

html{
  scroll-padding-top:calc(140px + env(safe-area-inset-top,0px));
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:var(--cream);
  color:var(--ink);

  background-image:
    radial-gradient(
      circle at 10% 0%,
      rgba(122,13,16,0.06),
      transparent 40%
    ),
    radial-gradient(
      circle at 90% 10%,
      rgba(212,175,55,0.10),
      transparent 35%
    );
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:50;

  background:
    linear-gradient(
      135deg,
      var(--maroon),
      var(--maroon-dark)
    );

  padding:
    calc(18px + env(safe-area-inset-top,0px))
    18px
    14px;

  color:white;

  box-shadow:
    0 6px 20px rgba(0,0,0,0.18);
}

/* ================= BRAND ================= */

.brand{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:4px;
}

.brand h1{
  font-family:'Playfair Display',serif;
  font-size:1.7rem;
  margin:0;
  letter-spacing:0.5px;
}

.brand .amp{
  color:var(--gold-light);
}

.brand p{
  margin:0;
  font-size:0.75rem;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--gold-light);
  opacity:0.9;
}

/* ================= SEARCH ================= */

.searchwrap{
  margin-top:14px;
}

.searchwrap input{
  width:100%;

  padding:11px 16px;

  border-radius:999px;
  border:none;
  outline:none;

  font-family:'Poppins',sans-serif;
  font-size:0.95rem;

  background:rgba(255,255,255,0.94);
  color:var(--ink);
}

/* ================= CATEGORY TABS ================= */

nav.tabs{
  display:flex;
  gap:8px;

  overflow-x:auto;

  padding:12px 14px 0;

  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}

nav.tabs::-webkit-scrollbar{
  display:none;
}

nav.tabs button{
  flex:0 0 auto;

  border:1px solid rgba(212,175,55,0.5);

  background:rgba(255,255,255,0.06);

  color:var(--gold-light);

  padding:7px 14px;

  border-radius:999px;

  font-family:'Poppins',sans-serif;
  font-size:0.78rem;
  font-weight:600;

  letter-spacing:0.3px;

  white-space:nowrap;

  cursor:pointer;
}

nav.tabs button.active{
  background:var(--gold);
  color:var(--maroon-dark);
  border-color:var(--gold);
}

/* ================= MAIN ================= */

main{
  max-width:720px;
  margin:0 auto;
  padding:18px 14px 60px;
}

/* ================= SECTION ================= */

.section{
  margin-bottom:26px;
  scroll-margin-top:150px;
}

.section h2{
  font-family:'Playfair Display',serif;

  color:var(--maroon);

  font-size:1.25rem;

  border-bottom:2px solid var(--gold);

  padding-bottom:6px;

  margin:0 0 10px;

  display:flex;
  align-items:baseline;
  gap:8px;
}

.section h2 small{
  font-family:'Poppins',sans-serif;

  font-size:0.65rem;

  color:var(--muted);

  font-weight:500;

  letter-spacing:1px;

  text-transform:uppercase;
}

/* ================= SUBHEAD ================= */

.subhead{
  font-weight:600;

  color:var(--maroon-dark);

  font-size:0.85rem;

  margin:14px 0 6px;

  text-transform:uppercase;

  letter-spacing:0.5px;

  opacity:0.85;
}

/* ================= MENU ITEM ================= */

.item{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;

  background:var(--card);

  border-radius:12px;

  padding:11px 14px;

  margin-bottom:8px;

  box-shadow:
    0 1px 3px rgba(122,13,16,0.06);

  border:
    1px solid rgba(122,13,16,0.06);
}

.item .name{
  font-size:0.92rem;

  font-weight:500;

  color:var(--ink);
}

/* ================= VEG / NON VEG DOT ================= */

.item .name .veg-dot,
.item .name .nonveg-dot{
  display:inline-block;

  width:9px;
  height:9px;

  border-radius:2px;

  margin-right:7px;

  border:1.3px solid;
}

.veg-dot{
  border-color:#1e7d32;
  background:#2fa845;
}

.nonveg-dot{
  border-color:#a3271f;
  background:#c8382e;
}

/* ================= PRICE ================= */

.item .price{
  font-weight:700;

  color:var(--maroon);

  font-size:0.92rem;

  white-space:nowrap;
}

/* ================= HIDDEN ================= */

.hidden{
  display:none !important;
}

.empty-msg{
  text-align:center;

  color:var(--muted);

  padding:40px 10px;

  font-size:0.95rem;
}

/* ================= FOOTER ================= */

footer{
  text-align:center;

  padding:26px 16px 40px;

  color:var(--muted);

  font-size:0.78rem;
}

footer .divider{
  width:60px;
  height:2px;

  background:var(--gold);

  margin:0 auto 14px;
}

</style>
</head>

  </div>

</header>


<!-- ================= MAIN MENU ================= -->

<main id="main"></main>

/* =====================================================
   HTML ELEMENTS
===================================================== */

const main = document.getElementById('main');

const tabsEl = document.getElementById('tabs');


/* =====================================================
   CREATE URL-FRIENDLY SLUG
===================================================== */

function slug(s){

  return s
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,'-');

}


/* =====================================================
   CREATE MENU SECTIONS
===================================================== */

MENU.forEach(section => {

  const id = slug(section.cat);


  /* ---------- CREATE CATEGORY BUTTON ---------- */

  const btn = document.createElement('button');

  btn.textContent = section.cat;

  btn.onclick = () => {

    document
      .getElementById(id)
      .scrollIntoView({
        behavior:'smooth',
        block:'start'
      });

  };

  tabsEl.appendChild(btn);


  /* ---------- CREATE SECTION ---------- */

  const sec = document.createElement('section');

  sec.className = 'section';

  sec.id = id;


  /* ---------- SECTION TITLE ---------- */

  sec.innerHTML = `
    <h2>
      ${section.cat}

      <small>
        ${section.items.filter(i => i.p).length} items
      </small>

    </h2>
  `;


  /* ---------- CREATE ITEMS ---------- */

  section.items.forEach(it => {

    const row = document.createElement('div');

    row.className = 'item';


    /* Search text */

    row.dataset.name = it.n.toLowerCase();


    /* Veg / Non-Veg indicator */

    const dot = it.p
      ? `<span class="${it.v ? 'veg-dot' : 'nonveg-dot'}"></span>`
      : '';


    /* Menu item HTML */

    row.innerHTML = `

      <span class="name">
        ${dot}
        ${it.n}
      </span>

      ${
        it.p
          ? `<span class="price">₹${it.p}</span>`
          : ''
      }

    `;


    sec.appendChild(row);

  });


  /* ---------- ADD SECTION TO PAGE ---------- */

  main.appendChild(sec);

});


/* =====================================================
   SEARCH / FILTER
===================================================== */

function filterItems(){

  const q =
    document
      .getElementById('search')
      .value
      .trim()
      .toLowerCase();


  let anyVisible = {};


  /* ---------- FILTER ITEMS ---------- */

  document
    .querySelectorAll('.item')
    .forEach(row => {

      const match =
        !q ||
        row.dataset.name.includes(q);


      row.classList.toggle(
        'hidden',
        !match
      );

    });


  /* ---------- HIDE EMPTY SECTIONS ---------- */

  document
    .querySelectorAll('.section')
    .forEach(sec => {

      const visibleItems =
        sec.querySelectorAll(
          '.item:not(.hidden)'
        );


      sec.classList.toggle(
        'hidden',
        q && visibleItems.length === 0
      );

    });

}
